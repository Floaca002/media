networks:
  vault-internal:
    internal: false # set to true once the reverse proxy is the only public entrypoint

services:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent-config:/config
      - media-downloads:/data/downloads
    networks:
      - vault-internal
    # No 'ports:' published to the host — only vault-backend (same network)
    # can reach its WebUI. Access it only via this app.
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:latest
    environment:
      - TZ=Etc/UTC
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - media-library:/data/media
    networks:
      - vault-internal
    # No 'ports:' published — the Jellyfin UI is never opened directly.
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - prowlarr-config:/config
    networks:
      - vault-internal
    # No 'ports:' published — indexer setup happens once (temporarily
    # expose 9696 for it), then Prowlarr is never opened again; Radarr and
    # Sonarr pull indexers from it automatically via its "Apps" sync.
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - radarr-config:/config
      - media-downloads:/data/downloads
      - media-library:/data/media
    networks:
      - vault-internal
    # No 'ports:' published — Vault triggers everything via Radarr's API;
    # its own UI is only needed once, for initial root folder/indexer setup.
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - sonarr-config:/config
      - media-downloads:/data/downloads
      - media-library:/data/media
    networks:
      - vault-internal
    # No 'ports:' published — same as radarr above.
    restart: unless-stopped

  vault-backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - media-downloads:/data/downloads
      - media-library:/data/media
      # Read-only access to Jellyfin's config volume so the backend can read
      # the one-time password-reset PIN file it writes there. See
      # app/routers/auth.py — the human must still retrieve and submit the
      # PIN themselves, so this doesn't weaken the reset flow's security
      # property (proof of real server access), it just removes a
      # dependency on Jellyfin's own PIN-redemption API endpoint.
      - jellyfin-config:/jellyfin-config:ro
    depends_on:
      - qbittorrent
      - jellyfin
      - radarr
      - sonarr
    networks:
      - vault-internal
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Without this, the container inherits the host's /etc/resolv.conf,
    # which on systemd-resolved distros (e.g. CachyOS) often just points to
    # the local stub resolver at 127.0.0.53 — unreachable from inside a
    # container's network namespace, causing intermittent or total failure
    # to resolve external hosts like api.themoviedb.org.
    dns:
      - 1.1.1.1
      - 8.8.8.8

  vault-frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - vault-backend
    networks:
      - vault-internal
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  qbittorrent-config:
  jellyfin-config:
  jellyfin-cache:
  prowlarr-config:
  radarr-config:
  sonarr-config:
  # media-downloads and media-library are separate named volumes, but with
  # the default local driver they both live under /var/lib/docker/volumes
  # on the same host filesystem, so the organizer's hardlink step works.
  # If you bind-mount these to different physical disks instead, the
  # organizer automatically falls back to copying the file.
  media-downloads:
  media-library:
